[package]
name = "rustmc-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
futures = "0.3.34"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
md-5 = "0.11.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
