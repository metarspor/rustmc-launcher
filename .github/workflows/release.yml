name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: rustmc-launcher-linux-x86_64.tar.gz
            bin: rustmc-launcher
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rustmc-launcher-windows-x86_64.zip
            bin: rustmc-launcher.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: rustmc-launcher-macos-x86_64.tar.gz
            bin: rustmc-launcher
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: rustmc-launcher-macos-aarch64.tar.gz
            bin: rustmc-launcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: endsWith(matrix.asset, '.tar.gz')
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset }} ${{ matrix.bin }}
        shell: bash

      - name: Package (zip)
        if: endsWith(matrix.asset, '.zip')
        shell: powershell
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}.exe" -DestinationPath "${{ matrix.asset }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*
          generate_release_notes: true
          draft: false
          prerelease: false
